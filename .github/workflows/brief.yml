name: Fetch the morning's items

# HOW THIS JOB IS TRIGGERED - and why the clock is no longer the main door.
#
# All times below are Karachi (PKT, UTC+5). The cron values themselves are UTC
# because GitHub requires it.
#
# THE PRIMARY DOOR IS THE PUSH, NOT THE SCHEDULE.
# GitHub's SCHEDULER is what is broken, not Actions. Their own docs say a
# scheduled run "can be delayed during periods of high load" and that "some
# queued jobs may be dropped". Measured on this repo: 1.5h late on 26 Aug, 11h
# on 28 Aug, 3.5h on 30 Aug 2026 - while a manual dispatch ran in 16 seconds,
# minutes apart from one of those.
#
# The delay is a MOVING VARIABLE, so no cron can be tuned against it. Four
# missed briefs proved that. The Claude routine has fired at 8:00am every
# single day without exception, so it now pushes .fetch-trigger and WAITS for
# items.json to change. How late GitHub's scheduler runs stopped mattering.
#
# WHY THE TWO MORNING CRONS STAY.
# They cover the one failure the push cannot: the routine itself not running.
# On a good day they land before 8:00am and the routine's own fetch is a fast
# no-op. Two Actions minutes to remove a single point of failure.
#
# WHY TWO EVENING CRONS WERE REMOVED - 5 Sep 2026.
# 7:00pm and 8:30pm THE EVENING BEFORE were a workaround shaped around the SIZE
# of someone else's delay. They only landed in front of the 8:00am read if
# GitHub happened to be 9.5 to 11.5 hours late. The delay moved to 3-5 hours
# and they fell straight through the gap - which is what killed the whole
# schedule-tuning approach. With the push door proven over four clean mornings
# they were two runs a day firing into the void.
#
# Both remaining times are deliberately off the hour - GitHub's docs name the
# top of the hour as peak load, which is when queued jobs get dropped.
on:
  schedule:
    - cron: "10 0 * * *"      #  5:10am PKT   - backstop only, if the routine does not fire
    - cron: "20 1 * * *"      #  6:20am PKT   - backstop only, if the routine does not fire
  workflow_dispatch:        # so it can be run by hand from the Actions tab

  # THE POINT OF THIS DOOR.
  # GitHub's SCHEDULER is what is broken, not Actions. A manual Run workflow
  # executes instantly while cron runs hours late, and the delay is not even
  # stable - 1.5h on 26 Aug, 11h on 28 Aug, 3.5h on 30 Aug. No schedule can be
  # tuned against a number that moves eight hours in three days.
  #
  # So the Claude routine, which has fired at 8:00am every single day without
  # exception, pushes .fetch-trigger and then WAITS for items.json to change.
  # It stops guessing that a fetch already happened and watches for it instead.
  #
  # THE PATH FILTER IS NOT OPTIONAL. Without it, EVERY push fires this job -
  # including this job's own commit of items.json, and the routine's nightly
  # archive of the brief. That is an endless loop burning Actions minutes.
  push:
    paths:
      - '.fetch-trigger'

permissions:
  contents: write           # it commits items.json back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # This machine CAN reach the open internet. That is the entire reason
      # this job exists - Anthropic's sandbox cannot, so the fetching happens
      # here and the thinking happens there.
      - name: Fetch feeds
        run: python fetch.py

      - name: Fail if nothing came back
        run: |
          COUNT=$(python -c "import json; print(len(json.load(open('items.json'))['items']))")
          echo "fetched $COUNT items"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::All feeds returned zero items. Not committing - a stale items.json is better than an empty one."
            exit 1
          fi

      - name: Commit items.json
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "noreply@github.com"
          git add -f items.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "items: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi
