name: Fetch the morning's items

# TWO attempts, both well before the Claude routine at 03:00 UTC.
#
# Why two, and why so early: GitHub's scheduler is best-effort. Their own docs
# say a scheduled run "can be delayed during periods of high load" and that
# "some queued jobs may be dropped". On the first unattended morning this job
# was scheduled for 02:30, ran at 03:12 - 42 minutes late - and the routine
# had already run at 03:03 and correctly refused the stale file.
#
# 01:30 gives 93 minutes of slack. 02:20 is a second chance if the first is
# dropped entirely. Neither is on the hour, which is when load peaks.
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "20 2 * * *"
  workflow_dispatch:        # so it can be run by hand from the Actions tab

permissions:
  contents: write           # it commits items.json back to the repo

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # This machine CAN reach the open internet. That is the entire reason
      # this job exists - Anthropic's sandbox cannot, so the fetching happens
      # here and the thinking happens there.
      - name: Fetch feeds
        run: python fetch.py

      - name: Fail if nothing came back
        run: |
          COUNT=$(python -c "import json; print(len(json.load(open('items.json'))['items']))")
          echo "fetched $COUNT items"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::All feeds returned zero items. Not committing - a stale items.json is better than an empty one."
            exit 1
          fi

      - name: Commit items.json
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "noreply@github.com"
          git add -f items.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "items: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi
