name: Watchdog - did the brief actually go out?

# GitHub emails you when a workflow FAILS. It cannot email you about a workflow
# that never RAN, because there is nothing to report: no run, no log, no exit
# code. Just silence.
#
# And silence is the failure this project actually had. On 22 Aug the fetch was
# scheduled for 02:30, committed at 03:12, and the routine had already read a
# 20-hour-old file at 03:03 and refused it. Nothing errored. Nothing alerted.
#
# So this job does not watch for errors. It watches for ABSENCE - and it now
# watches BOTH machines. items.json proves GitHub did its half. The dated file
# in briefs/ proves the Anthropic routine did its half, because the routine
# commits it only AFTER the email sends. Neither company's outage can hide
# behind the other. A failing workflow is something GitHub already knows how
# to shout about.
#
# 04:00 UTC = 9:00am Asia/Karachi, a full hour after the routine reads at 8:00.
# It was 03:30 until the delivery check was added; half an hour is enough for
# the fetch to be decided but not always for the routine to finish writing and
# pushing - a 5-minute run is normal and a slow one would have cried wolf.
# Running the watchdog late costs nothing, because nothing waits on it.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read            # it only looks. It never writes anything back.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50     # checkout is shallow by default - one commit,
                              # no history, and the redundancy count would be
                              # blind. 50 covers well over a week of fetches.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No pip install. watchdog.py is standard library only, on purpose -
      # a monitor with dependencies is a monitor that can break on its own.
      - name: Was there fresh data at 8am?
        run: python watchdog.py
